        const ALLOWED_IP = "92.181.2.61";

        function showError(text) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.classList.remove('hidden');
        }

        async function verifyAccess(callback) {
            if (!ALLOWED_IP) return callback();
            try {
                const res = await fetch('https://api.ipify.org?format=json');
                const data = await res.json();
                if (data.ip === ALLOWED_IP) {
                    callback();
                } else {
                    document.body.innerHTML = '<div class="flex items-center justify-center h-screen"><h1 class="text-rose-500 text-2xl font-bold">ОШИБКА ДОСТУПА. НЕВЕРНЫЙ IP-АДРЕС.</h1></div>';
                }
            } catch (e) {
                showError("Ошибка проверки IP-адреса");
            }
        }

        function decryptAndRun(password) {
            try {
                // Пытаемся расшифровать
                const bytes = CryptoJS.AES.decrypt(ENC_PAYLOAD, password);
                const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                if (!decrypted) throw new Error("bad_password");
                
                // Сохраняем пароль локально (ПРИВЯЗКА К УСТРОЙСТВУ)
                localStorage.setItem('admin_dev_token', password);
                
                // Переписываем страницу вашим исходным кодом
                document.open();
                document.write(decrypted);
                document.close();
            } catch (e) {
                showError("Неверный пароль!");
                localStorage.removeItem('admin_dev_token');
            }
        }

        function unlock() {
            const pwd = document.getElementById('pwd').value;
            if (!pwd) return showError("Введите пароль");
            
            verifyAccess(() => {
                decryptAndRun(pwd);
            });
        }

        // Авто-вход для привязанного устройства
        window.onload = () => {
            const savedPwd = localStorage.getItem('admin_dev_token');
            if (savedPwd) {
                document.getElementById('login-box').style.display = 'none'; // Прячем форму пока грузится
                verifyAccess(() => {
                    decryptAndRun(savedPwd);
                });
            }
        };
    </script>
