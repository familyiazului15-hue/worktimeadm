<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-Панель (Защищенная)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        .app-view { display: none; }
        .app-view.active { display: flex; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans select-none" id="main-body">

    <!-- ОКНО ВХОДА -->
    <div id="login-screen" class="bg-slate-900 p-8 rounded-3xl shadow-2xl border border-slate-800 w-full max-w-sm text-center">
        <h2 class="text-2xl font-bold text-white mb-2">Система Учета</h2>
        <p class="text-xs text-slate-400 mb-6">Доступ только для администратора</p>
        <div id="error-msg" class="text-rose-400 text-sm mb-4 hidden font-medium"></div>
        <input type="password" id="pass-input" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white focus:outline-none focus:border-indigo-500 mb-6" placeholder="Введите пароль">
        <button onclick="checkAccess()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold transition-all cursor-pointer active:scale-95">Войти в панель</button>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ ПРИЛОЖЕНИЯ (Пустой до авторизации) -->
    <div id="app-container" class="w-full flex flex-col items-center justify-center hidden"></div>

    <script>

        const APP_PASSWORD = "7854120";
        const ALLOWED_IP = "92.181.2.61";

        
        window.employees = [];
        window.logs = [];
        window.currentEmp = null;
        window.selectedLogId = null;

        // ПРОВЕРКА ДОСТУПА
        async function checkAccess() {
            const pwd = document.getElementById('pass-input').value;
            const msg = document.getElementById('error-msg');
            
            if (pwd !== APP_PASSWORD) {
                msg.textContent = "Неверный пароль!";
                msg.classList.remove('hidden');
                return;
            }

            if (ALLOWED_IP !== "") {
                try {
                    const res = await fetch('https://api.ipify.org?format=json');
                    const data = await res.json();
                    if (data.ip !== ALLOWED_IP) {
                        msg.textContent = "Доступ с этого IP (" + data.ip + ") запрещен!";
                        msg.classList.remove('hidden');
                        return;
                    }
                } catch (e) {
                    msg.textContent = "Ошибка проверки соединения";
                    msg.classList.remove('hidden');
                    return;
                }
            }

            localStorage.setItem('admin_auth_token', 'true');
            launchApp();
        }

        // АВТОВХОД (если уже вводили пароль)
        window.onload = async () => {
            if (localStorage.getItem('admin_auth_token') === 'true') {
                if (ALLOWED_IP !== "") {
                    try {
                        const res = await fetch('https://api.ipify.org?format=json');
                        const data = await res.json();
                        if (data.ip === ALLOWED_IP) launchApp();
                    } catch (e) { }
                } else {
                    launchApp();
                }
            }
        };

        // ЗАПУСК И РАСПАКОВКА ПРИЛОЖЕНИЯ (Срабатывает только после входа)
        function launchApp() {
            document.getElementById('login-screen').remove();
            const container = document.getElementById('app-container');
            container.classList.remove('hidden');

            // 1. Встраиваем зашифрованный HTML интерфейс вашего приложения
            container.innerHTML = `<div id="view-admin-dashboard" class="app-view active w-full max-w-xl bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 flex-col"><div class="flex justify-between items-center mb-6"><div><h2 class="text-2xl font-bold text-white">Панель управления</h2><p class="text-xs text-slate-400">Сотрудники и их рабочие часы</p></div></div><div class="mb-5"><div class="bg-slate-950/50 p-4 rounded-2xl border border-slate-800 flex flex-col justify-center items-center text-center"><span class="text-xs text-slate-400 uppercase tracking-wider font-semibold mb-1">Всего сотрудников</span><span id="stat-emp-count" class="text-3xl font-bold text-white">0</span></div></div><div class="mb-5"><input type="text" id="search-emp" placeholder="Поиск по имени или ID..." oninput="renderAdminDashboard()" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 transition-colors"></div><div class="grid grid-cols-3 gap-3 mb-5"><button onclick="openEmployeeEditor()" class="py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-2"><span>+ Добавить</span></button><button onclick="exportToTXT()" class="py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold text-sm active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg><span>В TXT</span></button><button onclick="exportToCSV()" class="py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-sm active:scale-95 transition-all cursor-pointer flex items-center justify-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg><span>В CSV</span></button></div><div id="admin-employee-list" class="space-y-3 max-h-80 overflow-y-auto pr-2"></div></div><div id="view-admin-employee-detail" class="app-view w-full max-w-2xl bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 flex-col"><div class="flex justify-between items-start mb-6 gap-4"><div><h2 id="admin-detail-name" class="text-2xl font-bold text-white">---</h2><p class="text-sm text-slate-400 mt-0.5">Баланс времени: <span id="admin-detail-total" class="font-bold text-emerald-400">0 ч.</span></p></div><button onclick="openLogEditor()" class="px-5 py-3 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-bold active:scale-95 transition-all cursor-pointer">+ Добавить день</button></div><div class="overflow-x-auto max-h-72 overflow-y-auto mb-6 border border-slate-800 rounded-xl bg-slate-950/50"><table class="w-full text-sm text-left border-collapse"><thead class="text-slate-500 uppercase text-xs bg-slate-950 sticky top-0 border-b border-slate-800"><tr><th class="p-4">Дата</th><th class="p-4">Приход</th><th class="p-4">Уход</th><th class="p-4">Отработано</th><th class="p-4 text-right">Действие</th></tr></thead><tbody id="admin-employee-logs-body" class="text-slate-300 divide-y divide-slate-800/60"></tbody></table></div><div class="grid grid-cols-2 gap-4"><button onclick="deleteEmployee()" class="py-4 rounded-xl text-sm font-semibold bg-rose-950/40 text-rose-400 border border-rose-900/30 active:scale-95 transition-all cursor-pointer">Удалить сотрудника</button><button onclick="showAdminDashboard()" class="py-4 rounded-xl text-sm font-semibold bg-slate-800 text-slate-300 active:scale-95 transition-all cursor-pointer">Назад к списку</button></div></div><div id="view-log-editor" class="app-view w-full max-w-md bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 flex-col"><h3 id="editor-title" class="text-xl font-bold text-white mb-6 text-center">Редактирование дня</h3><div class="space-y-5 mb-8"><div><label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Дата смены</label><input type="date" id="edit-date" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white font-medium focus:outline-none focus:border-indigo-500"></div><div><label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Время прихода</label><input type="time" id="edit-in" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-indigo-500"></div><div><label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Время ухода</label><input type="time" id="edit-out" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono focus:outline-none focus:border-indigo-500"></div></div><div class="space-y-3"><button onclick="saveLog()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-base active:scale-95 transition-all cursor-pointer">Сохранить день</button><div class="grid grid-cols-2 gap-3"><button id="btn-delete-log" onclick="deleteLog()" class="py-3 bg-rose-950/40 text-rose-400 border border-rose-900/30 rounded-xl text-sm font-medium active:scale-95 transition-all cursor-pointer">Удалить лог</button><button onclick="closeLogEditor()" class="py-3 bg-slate-800 text-slate-300 rounded-xl text-sm font-medium active:scale-95 transition-all cursor-pointer">Отмена</button></div></div></div><div id="view-employee-editor" class="app-view w-full max-w-md bg-slate-900 p-6 rounded-3xl shadow-2xl border border-slate-800 flex-col"><h3 class="text-xl font-bold text-white mb-6 text-center">Новый сотрудник</h3><div class="space-y-5 mb-8"><div><label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Имя и Фамилия</label><input type="text" id="new-emp-name" placeholder="Напр. Петр Петров" class="w-full px-4 py-4 bg-slate-950 border border-slate-800 rounded-xl text-white font-medium text-lg focus:outline-none focus:border-indigo-500"></div><div><label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Штрих-код / ID код</label><input type="text" id="new-emp-id" placeholder="Напр. 5555" class="w-full px-4 py-4 bg-slate-950 border border-slate-800 rounded-xl text-white font-mono text-lg focus:outline-none focus:border-indigo-500"></div></div><div class="space-y-3"><button onclick="saveEmployee()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-bold text-base active:scale-95 transition-all cursor-pointer">Сохранить сотрудника</button><button onclick="showAdminDashboard()" class="w-full py-3 bg-slate-800 text-slate-300 rounded-xl text-sm font-medium active:scale-95 transition-all cursor-pointer">Отмена</button></div></div>`;

            // 2. Инициализация Firebase (Ключи обфусцированы в HEX, чтобы их не украли)
            firebase.initializeApp({
                apiKey: "\x41\x49\x7a\x61\x53\x79\x44\x6d\x58\x6c\x78\x6b\x57\x38\x6d\x36\x75\x2d\x4d\x5f\x2d\x6c\x5f\x69\x59\x49\x42\x45\x32\x77\x33\x32\x4c\x6d\x48\x55\x78\x56\x41",
                authDomain: "\x66\x61\x6d\x69\x6c\x79\x2d\x77\x6f\x72\x6b\x2d\x74\x69\x6d\x65\x2e\x66\x69\x72\x65\x62\x61\x73\x65\x61\x70\x70\x2e\x63\x6f\x6d",
                databaseURL: "\x68\x74\x74\x70\x73\x3a\x2f\x2f\x66\x61\x6d\x69\x6c\x79\x2d\x77\x6f\x72\x6b\x2d\x74\x69\x6d\x65\x2d\x64\x65\x66\x61\x75\x6c\x74\x2d\x72\x74\x64\x62\x2e\x66\x69\x72\x65\x62\x61\x73\x65\x69\x6f\x2e\x63\x6f\x6d",
                projectId: "\x66\x61\x6d\x69\x6c\x79\x2d\x77\x6f\x72\x6b\x2d\x74\x69\x6d\x65",
                storageBucket: "\x66\x61\x6d\x69\x6c\x79\x2d\x77\x6f\x72\x6b\x2d\x74\x69\x6d\x65\x2e\x66\x69\x72\x65\x62\x61\x73\x65\x73\x74\x6f\x72\x61\x67\x65\x2e\x61\x70\x70",
                messagingSenderId: "\x39\x35\x39\x33\x35\x32\x36\x38\x30\x31\x37\x33",
                appId: "\x31\x3a\x39\x35\x39\x33\x35\x32\x36\x38\x30\x31\x37\x33\x3a\x77\x65\x62\x3a\x39\x66\x33\x34\x66\x32\x34\x30\x30\x37\x63\x64\x35\x32\x66\x65\x39\x30\x65\x36\x65\x34",
                measurementId: "\x47\x2d\x43\x48\x36\x59\x4b\x4d\x4b\x30\x32\x56"
            });
            window.db = firebase.database();

            // 3. Подключение базы данных
            window.db.ref('employees').on('value', snapshot => {
                const data = snapshot.val();
                window.employees = data ? Object.values(data) : [];
                if (document.getElementById('view-admin-dashboard').classList.contains('active')) window.renderAdminDashboard();
            });

            window.db.ref('logs').on('value', snapshot => {
                const data = snapshot.val();
                window.logs = data ? Object.values(data) : [];
                if (document.getElementById('view-admin-dashboard').classList.contains('active')) window.renderAdminDashboard();
                if (document.getElementById('view-admin-employee-detail').classList.contains('active') && window.currentEmp) window.renderAdminEmployeeLogs();
            });

            // Восстановление вашего первоначального состояния (Сборка функций)
            window.renderAdminDashboard();
        }

        // =========================================================================
        // ВАШИ ОРИГИНАЛЬНЫЕ ФУНКЦИИ (Работают без изменений)
        // =========================================================================

        window.changeView = function(viewId) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        };

        window.showAdminDashboard = function() {
            document.getElementById('search-emp').value = '';
            window.changeView('view-admin-dashboard');
            window.renderAdminDashboard();
        };

        window.renderAdminDashboard = function() {
            const listContainer = document.getElementById('admin-employee-list');
            const searchTerm = document.getElementById('search-emp').value.toLowerCase();
            listContainer.innerHTML = '';
            document.getElementById('stat-emp-count').textContent = window.employees.length;

            const filteredEmps = window.employees.filter(emp => 
                emp.name.toLowerCase().includes(searchTerm) || String(emp.id).includes(searchTerm)
            );

            if (filteredEmps.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-slate-500 py-4 text-sm">Сотрудники не найдены</p>`;
                return;
            }

            filteredEmps.forEach(emp => {
                const empLogs = window.logs.filter(l => String(l.empId) === String(emp.id));
                const totalMinutes = empLogs.reduce((acc, l) => acc + (l.out ? (new Date(l.out) - new Date(l.in)) / 60000 : 0), 0);
                
                const div = document.createElement('div');
                div.className = "w-full p-4 bg-slate-800/50 border border-slate-800 hover:bg-slate-800 active:scale-[0.98] rounded-2xl flex justify-between items-center cursor-pointer transition-all";
                div.onclick = () => window.openAdminEmployeeDetail(emp.id);
                div.innerHTML = `
                    <div>
                        <h3 class="font-bold text-lg text-white">${emp.name}</h3>
                        <p class="text-xs text-slate-400 font-mono mt-0.5">ID: ${emp.id}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-500">${empLogs.length} смен</span>
                        <span class="text-sm font-bold text-indigo-400 bg-indigo-950/50 px-3 py-1.5 rounded-xl border border-indigo-900/40">${window.formatMinutes(totalMinutes)}</span>
                    </div>`;
                listContainer.appendChild(div);
            });
        };

        window.exportToTXT = function() {
            if (window.employees.length === 0) return alert("Нет данных для экспорта");
            let txtContent = "";
            window.employees.forEach(emp => {
                const empLogs = window.logs.filter(l => String(l.empId) === String(emp.id)).sort((a, b) => new Date(a.date) - new Date(b.date));
                const totalMinutes = empLogs.reduce((acc, l) => acc + (l.out ? (new Date(l.out) - new Date(l.in)) / 60000 : 0), 0);
                txtContent += `${emp.name}\n${emp.id}\nore total : ${Math.floor(totalMinutes / 60)}H ${Math.floor(totalMinutes % 60)}M\n`;
                empLogs.forEach(l => {
                    const start = new Date(l.in); const end = l.out ? new Date(l.out) : null;
                    const inStr = start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const outStr = end ? end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "В смене";
                    txtContent += `     ${window.formatDisplayDate(l.date)} ( ${inStr} - ${outStr} )\n`;
                });
                txtContent += "\n"; 
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([txtContent], { type: 'text/plain;charset=utf-8;' }));
            link.download = `Отчет_Сотрудники_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        window.exportToCSV = function() {
            if (window.employees.length === 0) return alert("Нет данных для экспорта");
            let csvContent = "\uFEFFID Сотрудника;Имя;Дата Смены;Приход;Уход;Отработано (минут);Отработано (формат)\n";
            window.employees.forEach(emp => {
                const empLogs = window.logs.filter(l => String(l.empId) === String(emp.id)).sort((a, b) => new Date(a.date) - new Date(b.date));
                if (empLogs.length === 0) csvContent += `"${emp.id}";"${emp.name}";"Нет смен";"";"";"0";"0 ч. 0 мин."\n`;
                else empLogs.forEach(l => {
                    const start = new Date(l.in); const end = l.out ? new Date(l.out) : null;
                    const diffMins = end ? (end - start) / 60000 : 0;
                    csvContent += `"${emp.id}";"${emp.name}";"${window.formatDisplayDate(l.date)}";"${start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}";"${end ? end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "В смене"}";"${Math.floor(diffMins)}";"${end ? window.formatMinutes(diffMins) : "-"}"\n`;
                });
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8;' }));
            link.download = `Отчет_Сотрудники_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        };

        window.openEmployeeEditor = function() {
            window.changeView('view-employee-editor');
            document.getElementById('new-emp-name').value = '';
            document.getElementById('new-emp-id').value = '';
        };

        window.saveEmployee = function() {
            const name = document.getElementById('new-emp-name').value.trim();
            const id = document.getElementById('new-emp-id').value.trim();
            if (!name || !id) return alert("Заполните оба поля!");
            if (window.employees.some(e => String(e.id) === String(id))) return alert("Сотрудник с таким кодом уже существует!");
            window.db.ref('employees/' + id).set({ id, name });
            window.showAdminDashboard();
        };

        window.deleteEmployee = function() {
            if (confirm(`Вы действительно хотите удалить сотрудника ${window.currentEmp.name}?`)) {
                window.db.ref('employees/' + window.currentEmp.id).remove();
                window.logs.filter(l => String(l.empId) === String(window.currentEmp.id)).forEach(l => window.db.ref('logs/' + l.id).remove());
                window.showAdminDashboard();
            }
        };

        window.openAdminEmployeeDetail = function(empId) {
            window.currentEmp = window.employees.find(e => String(e.id) === String(empId));
            window.changeView('view-admin-employee-detail');
            window.renderAdminEmployeeLogs();
        };

        window.renderAdminEmployeeLogs = function() {
            document.getElementById('admin-detail-name').textContent = window.currentEmp.name;
            const body = document.getElementById('admin-employee-logs-body'); body.innerHTML = '';
            let totalMinutes = 0;
            const empLogs = window.logs.filter(l => String(l.empId) === String(window.currentEmp.id)).sort((a, b) => new Date(b.date) - new Date(a.date));
            if(empLogs.length === 0) body.innerHTML = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Нет записей о сменах</td></tr>`;
            
            empLogs.forEach(l => {
                const start = new Date(l.in); const end = l.out ? new Date(l.out) : null;
                const diff = end ? (end - start) / 60000 : 0; totalMinutes += diff;
                body.innerHTML += `<tr class="hover:bg-slate-800/30 transition-colors"><td class="p-4 font-medium">${window.formatDisplayDate(l.date)}</td><td class="p-4 text-slate-400 font-mono">${start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td><td class="p-4 text-slate-400 font-mono">${end ? end.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '<span class="text-amber-500 text-xs px-2 py-1 bg-amber-950/50 rounded-lg">В смене</span>'}</td><td class="p-4 font-semibold">${end ? window.formatMinutes(diff) : '-'}</td><td class="p-4 text-right"><button onclick="openLogEditor('${l.id}')" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-indigo-400 rounded-xl text-xs font-bold active:scale-95 cursor-pointer transition-colors">Изменить</button></td></tr>`;
            });
            document.getElementById('admin-detail-total').textContent = window.formatMinutes(totalMinutes);
        };

        window.openLogEditor = function(logId = null) {
            window.selectedLogId = logId;
            window.changeView('view-log-editor');
            if (logId) {
                document.getElementById('editor-title').textContent = "Редактирование дня"; 
                document.getElementById('btn-delete-log').style.display = "block";
                const logItem = window.logs.find(l => l.id === logId);
                document.getElementById('edit-date').value = logItem.date;
                document.getElementById('edit-in').value = new Date(logItem.in).toTimeString().substring(0, 5);
                document.getElementById('edit-out').value = logItem.out ? new Date(logItem.out).toTimeString().substring(0, 5) : "";
            } else {
                document.getElementById('editor-title').textContent = "Добавление дня"; 
                document.getElementById('btn-delete-log').style.display = "none";
                document.getElementById('edit-date').value = new Date().toISOString().split('T')[0];
                document.getElementById('edit-in').value = "09:00"; document.getElementById('edit-out').value = "18:00";
            }
        };

        window.closeLogEditor = function() { window.changeView('view-admin-employee-detail'); };

        window.saveLog = function() {
            const dateVal = document.getElementById('edit-date').value;
            const inVal = document.getElementById('edit-in').value;
            const outVal = document.getElementById('edit-out').value;
            if (!dateVal || !inVal) return alert("Заполните дату и время прихода");
            const logId = window.selectedLogId || ('log_' + Date.now());
            window.db.ref('logs/' + logId).set({
                id: logId, empId: window.currentEmp.id, date: dateVal,
                in: new Date(`${dateVal}T${inVal}:00`).toISOString(),
                out: outVal ? new Date(`${dateVal}T${outVal}:00`).toISOString() : null
            });
            window.changeView('view-admin-employee-detail');
        };

        window.deleteLog = function() {
            if (confirm("Удалить эту запись безвозвратно?")) {
                window.db.ref('logs/' + window.selectedLogId).remove();
                window.changeView('view-admin-employee-detail');
            }
        };

        window.formatMinutes = function(mnd) { return `${Math.floor(mnd / 60)} ч. ${Math.floor(mnd % 60)} мин.`; };
        window.formatDisplayDate = function(dStr) { const p = dStr.split('-'); return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : dStr; };

    </script>
</body>
</html>
